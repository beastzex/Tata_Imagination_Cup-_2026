apiVersion: v1
kind: Namespace
metadata:
  name: tatasaathi-prod
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tatasaathi-config
  namespace: tatasaathi-prod
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  AWS_REGION: "ap-south-1" # RBI sovereign compliance: Mumbai
  DB_HOST: "postgres-service.tatasaathi-prod.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "tata_dukaan_saathi_db"
  KAFKA_BROKERS: "kafka-cluster-kafka-bootstrap.tatasaathi-prod.svc.cluster.local:9092"
  REDIS_HOST: "redis-master.tatasaathi-prod.svc.cluster.local"
  REDIS_PORT: "6379"
